# FIREWATCH egress boundary. No TLS interception, no forward-proxy auth secrets,
# no inbound host port mapping. The app enforces URL ScopePolicy; this proxy is
# the second network boundary. Production deployment should also restrict this
# container's egress with host/cloud firewall policy.
http_port 3128
visible_hostname firewatch-egress

acl CONNECT method CONNECT
acl Safe_ports port 80 443 8080 8443 9000
acl SSL_ports port 443 8443
acl firewatch_demo dstdomain demo
acl firewatch_demo_port port 9000
acl blocked_destination dst \
  0.0.0.0/8 \
  10.0.0.0/8 \
  100.64.0.0/10 \
  127.0.0.0/8 \
  169.254.0.0/16 \
  172.16.0.0/12 \
  192.0.0.0/24 \
  192.0.2.0/24 \
  192.168.0.0/16 \
  198.18.0.0/15 \
  198.51.100.0/24 \
  203.0.113.0/24 \
  224.0.0.0/4 \
  240.0.0.0/4 \
  ::/128 \
  ::1/128 \
  fc00::/7 \
  fe80::/10 \
  ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# A single explicitly named local demo service can be enabled by the Compose demo
# profile. No other private destination is allowed through this exception.
http_access allow firewatch_demo firewatch_demo_port
http_access deny blocked_destination
http_access deny to_localhost
http_access deny to_linklocal
http_access allow all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /run/squid.pid
